<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELTEX Ads</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;}
  body{font-family:'Inter',sans-serif;}
  .adplayer{position:relative;width:100vw;height:100vh;background:#000;}
  .adplayer video{width:100%;height:100%;object-fit:cover;display:block;}
  .tag{
    position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.55);color:#fff;font-size:9.5px;
    padding:3px 7px;border-radius:4px;letter-spacing:.04em;font-family:monospace;
  }
  .brand{
    position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.55);color:#FFB020;font-size:10px;
    padding:3px 8px;border-radius:4px;font-weight:700;
  }
  .mute{
    position:absolute;bottom:8px;right:8px;width:26px;height:26px;border-radius:50%;
    background:rgba(0,0,0,0.55);border:none;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .cta{
    position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;justify-content:space-between;
    background:rgba(0,0,0,0.55);border-radius:7px;padding:7px 8px 7px 10px;gap:8px;
  }
  .cta span{color:#fff;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cta button{
    background:#FFB020;color:#1A1300;border:none;border-radius:5px;padding:5px 10px;font-size:10.5px;font-weight:700;flex-shrink:0;cursor:pointer;
  }
  .empty-state{
    height:100%;display:flex;align-items:center;justify-content:center;color:#8A94A6;font-size:11.5px;text-align:center;padding:16px;
  }
</style>
</head>
<body>
<div class="adplayer" id="player"><div class="empty-state">Loading ad…</div></div>

<script>
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function logEvent(siteId, adId, type){
  fetch('/api/events', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({siteId, adId, type})
  }).catch(()=>{});
}

const params = new URLSearchParams(location.search);
const siteId = params.get('site') || null;
const player = document.getElementById('player');

async function boot(){
  let ads;
  try{
    const res = await fetch('/api/ads');
    ads = await res.json();
  }catch(e){
    player.innerHTML = '<div class="empty-state">Could not reach VELTEX Ads server.</div>';
    return;
  }
  if(!ads || !ads.length){
    player.innerHTML = '<div class="empty-state">No ads uploaded yet in VELTEX Ads.</div>';
    return;
  }

  const playlist = shuffle(ads);
  let idx = 0;
  let muted = true;

  function renderAd(ad){
    player.innerHTML = `
      <video id="v" src="${ad.url}" autoplay ${muted ? 'muted' : ''} playsinline></video>
      <div class="tag">AD</div>
      <div class="brand">VELTEX</div>
      <button class="mute" id="muteBtn">${muted ? '&#128263;' : '&#128266;'}</button>
      <div class="cta">
        <span>${escapeHtml(ad.name)}</span>
        <button id="ctaBtn">Learn more</button>
      </div>
    `;
    const video = document.getElementById('v');
    video.addEventListener('play', () => logEvent(siteId, ad.id, 'impression'), {once:true});
    video.addEventListener('ended', next);
    video.addEventListener('error', next);
    document.getElementById('muteBtn').onclick = () => {
      muted = !muted;
      video.muted = muted;
      document.getElementById('muteBtn').innerHTML = muted ? '&#128263;' : '&#128266;';
    };
    document.getElementById('ctaBtn').onclick = () => {
      logEvent(siteId, ad.id, 'click');
      window.open(ad.cta || '#', '_blank');
    };
  }

  function next(){
    idx = (idx+1) % playlist.length;
    renderAd(playlist[idx]);
  }

  renderAd(playlist[idx]);
}
boot();
</script>
</body>
</html>
